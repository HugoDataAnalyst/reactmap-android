name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write   # needed for creating releases & uploading assets

jobs:
  check_secrets:
    # run only if manual dispatch OR commit message contains 'deploy'
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'deploy') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub Secrets
        run: |
          missing=()
          [ -z "${{ secrets.KEYSTORE_FILE }}" ] && missing+=("KEYSTORE_FILE")
          [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] && missing+=("KEYSTORE_PASSWORD")
          [ -z "${{ secrets.KEY_ALIAS }}" ] && missing+=("KEY_ALIAS")
          [ -z "${{ secrets.KEY_PASSWORD }}" ] && missing+=("KEY_PASSWORD")
          [ -z "${{ secrets.MAP_URL }}" ] && missing+=("MAP_URL")
          [ -z "${{ secrets.APP_NAME }}" ] && missing+=("APP_NAME")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are present."

  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'deploy') }}
    needs: check_secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # (optional but recommended) speed up builds
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Restore keystore from secret (base64)
        run: echo "${{ secrets.KEYSTORE_FILE }}" | tr -d '\n' | base64 -d > keystore.jks

      - name: Make Gradlew executable
        run: chmod +x ./gradlew

      - name: Extract versionName from gradle.properties
        run: echo "VERSION_NAME=$(grep 'reactmap.versionName' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')" >> $GITHUB_ENV

      - name: Set Package Name
        run: echo "PACKAGE_NAME=${{ secrets.PACKAGE_NAME || 'be.mygod.reactmap' }}" >> $GITHUB_ENV

      - name: Build (signed) release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/keystore.jks \
            -Pandroid.injected.signing.store.password='${{ secrets.KEYSTORE_PASSWORD }}' \
            -Pandroid.injected.signing.key.alias='${{ secrets.KEY_ALIAS }}' \
            -Pandroid.injected.signing.key.password='${{ secrets.KEY_PASSWORD }}' \
            -Preactmap.defaultDomain='${{ secrets.MAP_URL }}' \
            -Preactmap.packageName='${{ env.PACKAGE_NAME }}' \
            -Preactmap.appName='${{ secrets.APP_NAME }}'

      # More robust find (handles split/universal APKs)
      - name: Locate release APK
        id: find_apk
        run: |
          set -euo pipefail
          ls -R app/build/outputs/apk/ || true
          APK_PATH="$(ls app/build/outputs/apk/release/*release*.apk | head -n 1 || true)"
          if [ -z "${APK_PATH}" ]; then
            echo "No release APK found in app/build/outputs/apk/release/"
            exit 1
          fi
          echo "APK_PATH=${APK_PATH}" >> $GITHUB_ENV
          echo "Found: ${APK_PATH}"

      - name: Rename APK with version
        run: |
          DEST="app/build/outputs/apk/release/${{ secrets.APP_NAME }}-v${{ env.VERSION_NAME }}.apk"
          cp "${APK_PATH}" "${DEST}"
          echo "Renamed to: ${DEST}"

      - name: Upload Artifact (v4)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ secrets.APP_NAME }}-v${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/${{ secrets.APP_NAME }}-v${{ env.VERSION_NAME }}.apk
          retention-days: 90

      - name: Create/Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          # unique tag per deploy so every 'deploy' push publishes a fresh release
          tag: v${{ env.VERSION_NAME }}+${{ github.run_number }}
          name: ${{ secrets.APP_NAME }} v${{ env.VERSION_NAME }} (build ${{ github.run_number }})
          artifacts: app/build/outputs/apk/release/${{ secrets.APP_NAME }}-v${{ env.VERSION_NAME }}.apk
          token: ${{ github.token }}
          generateReleaseNotes: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
