name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write   # needed for creating releases & uploading assets

jobs:
  check_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub Secrets
        run: |
          miss(){ echo "Missing $1 secret"; exit 1; }
          [ -z "${{ secrets.KEYSTORE_FILE }}" ] && miss KEYSTORE_FILE
          [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] && miss KEYSTORE_PASSWORD
          [ -z "${{ secrets.KEY_ALIAS }}" ] && miss KEY_ALIAS
          [ -z "${{ secrets.KEY_PASSWORD }}" ] && miss KEY_PASSWORD
          [ -z "${{ secrets.MAP_URL }}" ] && miss MAP_URL
          [ -z "${{ secrets.APP_NAME }}" ] && miss APP_NAME
          # GITHUB_TOKEN is auto-provided; don't check it as a secret.

  build:
    needs: check_secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore keystore from secret (base64)
        run: echo "${{ secrets.KEYSTORE_FILE }}" | tr -d '\n' | base64 -d > keystore.jks

      - name: Make Gradlew executable
        run: chmod +x ./gradlew

      - name: Extract versionName from gradle.properties
        run: echo "VERSION_NAME=$(grep 'reactmap.versionName' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')" >> $GITHUB_ENV

      - name: Set Package Name
        run: echo "PACKAGE_NAME=${{ secrets.PACKAGE_NAME || 'be.mygod.reactmap' }}" >> $GITHUB_ENV

      - name: Build (signed) release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/keystore.jks \
            -Pandroid.injected.signing.store.password='${{ secrets.KEYSTORE_PASSWORD }}' \
            -Pandroid.injected.signing.key.alias='${{ secrets.KEY_ALIAS }}' \
            -Pandroid.injected.signing.key.password='${{ secrets.KEY_PASSWORD }}' \
            -Preactmap.defaultDomain='${{ secrets.MAP_URL }}' \
            -Preactmap.packageName='${{ env.PACKAGE_NAME }}' \
            -Preactmap.appName='${{ secrets.APP_NAME }}'

      - name: Rename APK with version
        run: |
          ls -R app/build/outputs/apk/
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/${{ secrets.APP_NAME }}-v${{ env.VERSION_NAME }}.apk

      - name: Upload Artifact (v4)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ secrets.APP_NAME }}-v${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/${{ secrets.APP_NAME }}-v${{ env.VERSION_NAME }}.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: app/build/outputs/apk/release/${{ secrets.APP_NAME }}-v${{ env.VERSION_NAME }}.apk
          token: ${{ github.token }}
          generateReleaseNotes: true
          skipIfReleaseExists: true
          tag: v${{ env.VERSION_NAME }}
